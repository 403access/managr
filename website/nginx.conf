server {
  listen 3001;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 308 /managr/;
  }

  location = /managr {
    return 308 /managr/;
  }

  # Files are built for GitHub Pages at /managr/, and live in that directory here.
  location /managr/ {
    try_files $uri $uri.html $uri/ =404;
  }
}
