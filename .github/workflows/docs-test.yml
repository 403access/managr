name: Test site

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-deploy:
    name: Test site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      # Node is only needed to run the Docusaurus CLI; dependencies come from Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Bun's cache is handled by oven-sh/setup-bun.
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build website
        run: bun run build
